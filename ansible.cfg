[defaults]
inventory = inventory/generated.yml
roles_path = roles
collections_path = .ansible/collections
host_key_checking = True
interpreter_python = auto_silent
stdout_callback = default
display_skipped_hosts = False
retry_files_enabled = False
forks = 10

[ssh_connection]
ssh_args = -o ControlMaster=auto -o ControlPersist=120s -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=.local/known_hosts
pipelining = True

[privilege_escalation]
become = True
become_method = sudo
become_user = root
