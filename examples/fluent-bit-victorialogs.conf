
[SERVICE]
    Flush         5
    Daemon        Off
    Log_Level     info

[INPUT]
    Name              systemd
    Tag               kafka
    Systemd_Filter    _SYSTEMD_UNIT=kafka.service
    DB                /var/lib/fluent-bit/kafka-journal.db
    DB.Sync           Normal
    Read_From_Tail    On
    Strip_Underscores On

[FILTER]
    Name    modify
    Match   kafka
    Add     service  kafka
    Add     cluster  analytics
    Add     node_id  1

[FILTER]
    Name    record_modifier
    Match   kafka
    Record  host ${HOSTNAME}

[OUTPUT]
    Name             http
    Match            kafka
    Host             victorialogs
    Port             9428
    URI              /insert/jsonline
    Format           json_lines
    json_date_format iso8601
    json_date_key    _time
    Compress         gzip

    header           AccountID 0
    header           ProjectID 0
    uri_query        _msg_field=MESSAGE&_time_field=_time&_stream_fields=host,service,cluster,node_id

    Retry_Limit      5
