---
# ─────────────────────────────────────────────────────────────────────────────
# Version and download
# ─────────────────────────────────────────────────────────────────────────────

kafka_version: "4.3.1"
kafka_scala_version: "2.13"

kafka_mirror: "https://downloads.apache.org/kafka"
kafka_archive_mirror: "https://archive.apache.org/dist/kafka"

kafka_tarball_name: "kafka_{{ kafka_scala_version }}-{{ kafka_version }}.tgz"
kafka_tarball_url: "{{ kafka_mirror }}/{{ kafka_version }}/{{ kafka_tarball_name }}"
kafka_tarball_checksum_url: "{{ kafka_tarball_url }}.sha512"

kafka_tarball_sha512: "c7d7b2318cb51aa0c61d3246a51c349210073c5c9b754947ef965a439f2f939e8600f204e134a75ac31faf3829c9370960ef7c6a9886c8a1dbf0339a21f4c54c"

# ─────────────────────────────────────────────────────────────────────────────
# Layout and identity
# ─────────────────────────────────────────────────────────────────────────────

kafka_user: "kafka"
kafka_group: "kafka"

kafka_install_root: "/opt/kafka"
kafka_releases_dir: "{{ kafka_install_root }}/releases"
kafka_release_dir: "{{ kafka_releases_dir }}/{{ kafka_version }}"
kafka_current_dir: "{{ kafka_install_root }}/current"

kafka_config_dir: "/etc/kafka"
kafka_data_dir: "/var/lib/kafka"
kafka_log_dirs:
  - "{{ kafka_data_dir }}/data"

kafka_download_dir: "/opt/kafka/dist"

# ─────────────────────────────────────────────────────────────────────────────
# Java and JVM
# ─────────────────────────────────────────────────────────────────────────────

kafka_java_packages:
  - openjdk-21-jre-headless

kafka_heap_opts: "-Xms512m -Xmx512m"

kafka_jvm_performance_opts: >-
  -XX:+UseG1GC
  -XX:MaxGCPauseMillis=20
  -XX:InitiatingHeapOccupancyPercent=35
  -XX:+ExplicitGCInvokesConcurrent
  -Djava.awt.headless=true

# ─────────────────────────────────────────────────────────────────────────────
# Cluster identity
# ─────────────────────────────────────────────────────────────────────────────

kafka_cluster_name: "analytics"

kafka_cluster_group: "kafka"

kafka_cluster_id: ""
kafka_controller_directory_ids: {}

kafka_advertised_address: "{{ kafka_private_ip | default(ansible_default_ipv4.address) }}"
kafka_bind_address: "{{ kafka_advertised_address }}"

kafka_process_roles: "broker,controller"

# ─────────────────────────────────────────────────────────────────────────────
# Listeners
# ─────────────────────────────────────────────────────────────────────────────

kafka_broker_listener_name: "BROKER"
kafka_controller_listener_name: "CONTROLLER"
kafka_broker_port: 9092
kafka_controller_port: 9093

# ─────────────────────────────────────────────────────────────────────────────
# TLS
# ─────────────────────────────────────────────────────────────────────────────

kafka_tls_enabled: true

kafka_tls_generate_self_signed: true

kafka_tls_dir: "{{ kafka_config_dir }}/tls"
kafka_tls_ca_dir: "{{ kafka_tls_dir }}/ca"

kafka_tls_local_ca_dir: "{{ playbook_dir }}/../.local/pki"

kafka_tls_extra_sans: []

kafka_tls_ca_common_name: "{{ kafka_cluster_name }} Kafka internal CA"
kafka_tls_ca_validity_days: 3650
kafka_tls_cert_validity_days: 825
kafka_tls_key_size: 4096

kafka_tls_ca_cert_content: ""
kafka_tls_cert_content: ""
kafka_tls_key_content: ""

# ─────────────────────────────────────────────────────────────────────────────
# Authentication (SASL/SCRAM-SHA-512)
# ─────────────────────────────────────────────────────────────────────────────

kafka_sasl_enabled: true
kafka_sasl_mechanism: "SCRAM-SHA-512"

kafka_scram_users: []

kafka_admin_principal: "kafka_admin"
kafka_inter_broker_principal: "kafka_broker"

kafka_scram_iterations: 8192

kafka_scram_force_update: false

kafka_bootstrap_principals:
  - "{{ kafka_admin_principal }}"
  - "{{ kafka_inter_broker_principal }}"

# ─────────────────────────────────────────────────────────────────────────────
# Broker configuration
# ─────────────────────────────────────────────────────────────────────────────

kafka_default_replication_factor: 3
kafka_min_insync_replicas: 2
kafka_offsets_topic_replication_factor: 3
kafka_transaction_state_log_replication_factor: 3
kafka_transaction_state_log_min_isr: 2
kafka_num_partitions: 3

kafka_auto_create_topics_enable: false

kafka_num_network_threads: 3
kafka_num_io_threads: 8
kafka_socket_send_buffer_bytes: 102400
kafka_socket_receive_buffer_bytes: 102400
kafka_socket_request_max_bytes: 104857600
kafka_log_retention_hours: 168
kafka_log_segment_bytes: 1073741824
kafka_log_retention_check_interval_ms: 300000

kafka_extra_config: {}

# ─────────────────────────────────────────────────────────────────────────────
# Topics
# ─────────────────────────────────────────────────────────────────────────────

kafka_topics:
  - name: analytics.events
    partitions: 6
    replication_factor: 3
    config:
      cleanup.policy: delete
      retention.ms: 604800000
      min.insync.replicas: 2

kafka_topics_allow_delete: false

# ─────────────────────────────────────────────────────────────────────────────
# Observability
# ─────────────────────────────────────────────────────────────────────────────

kafka_metrics_enabled: true

kafka_jmx_exporter_version: "1.6.0"
kafka_jmx_exporter_port: 9404
kafka_jmx_exporter_dir: "{{ kafka_install_root }}/jmx-exporter"
kafka_jmx_exporter_jar: "{{ kafka_jmx_exporter_dir }}/jmx_prometheus_javaagent-{{ kafka_jmx_exporter_version }}.jar"
kafka_jmx_exporter_config: "{{ kafka_config_dir }}/jmx-exporter.yml"
kafka_jmx_exporter_url: >-
  https://github.com/prometheus/jmx_exporter/releases/download/{{ kafka_jmx_exporter_version }}/jmx_prometheus_javaagent-{{
  kafka_jmx_exporter_version }}.jar

kafka_jmx_exporter_sha256: "a95983fd96e865d2bcdf911cc500e7c82808c27ab9fd226bf96732b6c3d8c46e"

kafka_jmx_exporter_bind_address: "{{ kafka_bind_address }}"

kafka_jmx_opts: "-Dkafka.jmx.disabled=true"

kafka_victorialogs_enabled: false
kafka_victorialogs_url: ""

kafka_log_level: "INFO"
kafka_controller_log_level: "INFO"
kafka_authorizer_log_level: "INFO"

# ─────────────────────────────────────────────────────────────────────────────
# Service
# ─────────────────────────────────────────────────────────────────────────────

kafka_service_name: "kafka"
kafka_service_enabled: true
kafka_service_state: "started"

kafka_systemd_restart: "on-failure"
kafka_systemd_restart_sec: 10
kafka_systemd_timeout_stop_sec: 180
kafka_systemd_limit_nofile: 100000

kafka_health_check_retries: 30
kafka_health_check_delay: 10

kafka_rolling_restart_deferred: false
